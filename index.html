<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Lead CRM</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a1d23;--mu:#6b7280;--bd:#e3e6eb;--ac:#2563eb;--ok:#16a34a}
@media (prefers-color-scheme:dark){:root{--bg:#111317;--card:#1b1e25;--tx:#eceef2;--mu:#9aa1ad;--bd:#2c313b;--ac:#5b8def;--ok:#4ade80;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
.w{max-width:1000px;margin:0 auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative}
h1{font-size:20px;margin:0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}.st b{display:block;font-size:22px}.st span{color:var(--mu);font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}input{flex:1;min-width:140px}.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;align-items:center}
.row small{color:var(--mu)}.tag{font-size:11px;border:1px solid var(--bd);border-radius:99px;padding:2px 8px;white-space:nowrap}
.id{font-family:ui-monospace,monospace;font-size:12px;color:var(--ac)}
.bell{position:relative}.bell i{position:absolute;top:-6px;right:-6px;background:#dc2626;color:#fff;font-style:normal;font-size:11px;border-radius:99px;padding:0 6px}
#np{display:none;position:absolute;right:0;top:42px;width:min(320px,92vw);max-height:60vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;z-index:20}
#np div{padding:6px;border-bottom:1px solid var(--bd);font-size:13px}
#dr{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;align-items:flex-end;justify-content:center}
#dc{background:var(--card);width:min(560px,100%);max-height:88vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px}
#dc label{display:block;color:var(--mu);font-size:12px;margin:10px 0 3px}#dc input,#dc select,#dc textarea{width:100%}
.log{font-size:12px;color:var(--mu);margin-top:8px}
#ts{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:var(--ac);color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:40;max-width:90vw}
.empty{color:var(--mu);text-align:center;padding:30px}
</style></head><body><div class="w">
<div class="top"><h1>Lead CRM</h1><button class="bell" onclick="tn()">🔔<i id="nb" hidden>0</i></button><div id="np"></div></div>
<div class="stats" id="stats"></div>
<div class="bar"><input id="q" placeholder="Search name, phone, email or ID" oninput="draw()">
<select id="fs" onchange="draw()"><option value="">All sources</option></select>
<select id="ft" onchange="draw()"><option value="">All statuses</option></select></div>
<div class="list" id="ls"></div></div>
<div id="dr" onclick="if(event.target===this)this.style.display='none'"><div id="dc"></div></div><div id="ts"></div>
<script>
var SRC=['Meta Ads','WhatsApp','Website'],STS=['New','Contacted','Qualified','Follow-up','Won','Lost'],L=[],N=[],unread=0;
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML}
function fd(t){return new Date(t).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}
function toast(m){var t=document.getElementById('ts');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none'},3500)}
function notify(m){N.unshift({m:m,t:new Date()});unread++;bell();toast(m);try{if(Notification.permission==='granted')new Notification('Lead CRM',{body:m})}catch(e){}}
function bell(){var b=document.getElementById('nb');b.hidden=!unread;b.textContent=unread}
function tn(){var p=document.getElementById('np');if(p.style.display==='block'){p.style.display='none';return}
unread=0;bell();p.innerHTML=N.length?N.map(function(n){return '<div>'+esc(n.m)+'<br><small style="color:var(--mu)">'+fd(n.t)+'</small></div>'}).join(''):'<div>No alerts yet</div>';p.style.display='block';
try{if(Notification.permission==='default')Notification.requestPermission()}catch(e){}}
async function load(){try{L=await(await fetch('/api/leads')).json();draw()}catch(e){toast('Could not load leads')}}
function draw(){var q=document.getElementById('q').value.toLowerCase(),fs=document.getElementById('fs').value,ft=document.getElementById('ft').value;
var f=L.filter(function(l){return(!fs||l.source===fs)&&(!ft||l.status===ft)&&(!q||(l.name+l.phone+l.email+l.uid).toLowerCase().indexOf(q)>-1)});
var c=function(s){return L.filter(function(l){return l.status===s}).length};
document.getElementById('stats').innerHTML='<div class="st"><b>'+L.length+'</b><span>Total</span></div>'+['New','Contacted','Qualified','Won'].map(function(s){return '<div class="st"><b>'+c(s)+'</b><span>'+s+'</span></div>'}).join('');
document.getElementById('ls').innerHTML=f.length?f.map(function(l){return '<div class="row" onclick="op('+l.id+')"><div><span class="id">'+l.uid+'</span> <b>'+esc(l.name)+'</b><br><small>'+esc(l.phone)+' · '+fd(l.created)+'</small></div><div style="text-align:right"><span class="tag">'+esc(l.source)+'</span> <span class="tag" style="color:var(--ok)">'+esc(l.status)+'</span></div></div>'}).join(''):'<div class="empty">No leads yet. They will appear here automatically.</div>'}
function opts(a,v){return a.map(function(x){return '<option'+(x===v?' selected':'')+'>'+x+'</option>'}).join('')}
function op(id){var l=L.find(function(x){return x.id===id});if(!l)return;
document.getElementById('dc').innerHTML='<div class="id">'+l.uid+'</div><h2 style="margin:4px 0">'+esc(l.name)+'</h2><span class="tag">'+esc(l.source)+'</span>'+
'<label>Status</label><select onchange="pt('+id+',{status:this.value})">'+opts(STS,l.status)+'</select>'+
'<label>Phone</label><input value="'+esc(l.phone)+'" onchange="pt('+id+',{phone:this.value},1)">'+
'<label>Email</label><input value="'+esc(l.email)+'" onchange="pt('+id+',{email:this.value},1)">'+
'<label>Notes</label><textarea rows="3" onchange="pt('+id+',{note:this.value},1)">'+esc(l.note)+'</textarea>'+
'<div class="log"><b>Activity</b><br>'+l.log.map(function(g){return fd(g.t)+' — '+esc(g.m)}).join('<br>')+'</div>'+
'<p><button onclick="document.getElementById(\'dr\').style.display=\'none\'">Close</button></p>';
document.getElementById('dr').style.display='flex'}
async function pt(id,b,quiet){await fetch('/api/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});if(!quiet){await load();op(id)}}
document.getElementById('fs').innerHTML+=SRC.map(function(s){return '<option>'+s+'</option>'}).join('');
document.getElementById('ft').innerHTML+=STS.map(function(s){return '<option>'+s+'</option>'}).join('');
var es=new EventSource('/api/stream');es.onmessage=function(e){var d=JSON.parse(e.data);if(d.msg)notify(d.msg);load()};
load();
</script></body></html>
