services:
  - type: web
    name: lead-crm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DB_PATH
        value: /var/data/crm.db
      - key: WEBSITE_ORIGIN
        sync: false
      - key: META_VERIFY_TOKEN
        generateValue: true
      - key: META_APP_SECRET
        sync: false
      - key: META_PAGE_TOKEN
        sync: false
      - key: TELEGRAM_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
    disk:
      name: crm-data
      mountPath: /var/data
      sizeGB: 1
